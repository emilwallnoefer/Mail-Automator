name: Security Baseline

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/**"
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/**"
  # Advisories are published against versions we already ship, so the gate can
  # turn red without anyone pushing. Run it daily against main so that shows up
  # as its own failed run instead of on the next unrelated PR.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  web-security-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
