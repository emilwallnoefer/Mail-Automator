version: 2
updates:
  # Web app dependencies. Weekly, so a new Next.js release (or a fresh advisory
  # against the pinned one) lands as a PR within days instead of poisoning the
  # `npm audit` gate on an unrelated PR.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10
    # Rewrite the range in package.json too — `next` is pinned exactly, and a
    # lockfile-only bump would leave the pin stale.
    versioning-strategy: increase
    commit-message:
      prefix: "deps"
    groups:
      # next and eslint-config-next are version-locked to each other; never
      # let them arrive in separate PRs.
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "eslint-config-next"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
